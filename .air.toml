root = "."
tmp_dir = "bin"

[build]
  args_bin = []
  bin = "./bin/houston"
  cmd = "templ generate && go build -o ./bin/houston ./cmd/houston/main.go"
  delay = 1000
  exclude_dir = ["bin", "logs", "data", ".devcontainer", ".github", ".vscode", "node_modules", "static"]
  exclude_file = []
  exclude_regex = [".*_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "templ", "html", "css", "js"]
  include_file = []
  kill_delay = "0s"
  log = "air.error.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["npx tailwindcss -i ./views/tailwind.css -o ./public/css/styles.css"]
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = true
  silent = true
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = true
  keep_scroll = true
